name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: types
        run: bun run check

      - name: tests
        run: bun test src/tests/

      - name: native helpers
        run: bun run build:native

      - name: view bundle
        run: bun run build:view

      - name: smoke
        run: |
          bunx playwright install webkit
          bun run e2e/smoke.ts
