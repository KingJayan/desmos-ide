name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  types:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run check

  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run lint

  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run test

  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - run: bun run check
      - run: bun run lint
      - run: bun run test
      - run: bunx vite build

      - name: dpapi probe
        run: bun run scripts/dpapi-probe.ts

      - run: |
          bun run build:cli
          node dist/cli/dsmx.mjs --version
          node dist/cli/dsmx.mjs build example/orbit.dsmx -o out.html

  view:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - run: bunx vite build

      - uses: actions/upload-artifact@v4
        with:
          name: view
          path: dist
          retention-days: 1

  cli:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: dpapi probe
        run: bun run scripts/dpapi-probe.ts

      - run: |
          bun run build:cli
          node dist/cli/dsmx.mjs --version
          node dist/cli/dsmx.mjs build example/orbit.dsmx -o /dev/null

  grammar:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: the generated extension matches the compiler tables
        run: |
          bun run build:grammar
          git diff --exit-code editors/vscode

      - if: github.event_name == 'push'
        run: bun run pack:vsix

      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: desmos-dsl-vsix
          path: build/*.vsix

  smoke:
    needs: view
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-22.04", "macos-15", "windows-2022"]' || '["ubuntu-22.04"]') }}

    env:
      SMOKE_BROWSER: ${{ startsWith(matrix.os, 'windows') && 'chromium' || 'webkit' }}

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v4
        with:
          name: view
          path: dist

      - id: playwright
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ env.SMOKE_BROWSER }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}

      - if: runner.os == 'Linux'
        run: bunx playwright install-deps $SMOKE_BROWSER
        timeout-minutes: 8

      - if: steps.playwright.outputs.cache-hit != 'true'
        run: bunx playwright install ${{ env.SMOKE_BROWSER }}
        timeout-minutes: 8

      - run: bun run e2e/smoke.ts
        timeout-minutes: 8

  native:
    if: github.event_name == 'push'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - id: cache
        uses: actions/cache@v4
        with:
          path: |
            dist/native
            dist/quicklook
          key: native-${{ hashFiles('bun/native/**', 'scripts/build-native.ts') }}

      - if: steps.cache.outputs.cache-hit != 'true'
        run: bun run build:native

      - run: lipo -info dist/native/prompt

  app:
    if: github.event_name == 'push'
    needs: view
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - if: runner.os == 'Linux'
        name: Install the desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 \
            libwebkit2gtk-4.1-0 \
            libayatana-appindicator3-1 \
            librsvg2-2

      - uses: actions/download-artifact@v4
        with:
          name: view
          path: dist

      - run: bunx electrobun build

      - if: runner.os == 'Linux'
        run: find build -maxdepth 3 -print

      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Depth 3 build | Select-Object -ExpandProperty FullName
          $setup = Get-ChildItem -Recurse -Filter '*Setup*.exe' build | Select-Object -First 1
          if (-not $setup) { throw 'no *Setup*.exe under build/' }
          Write-Host "installer: $($setup.FullName)"
          $keys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          $found = $keys | Where-Object { Test-Path $_ }
          if ($found) {
            Write-Host "webview2 runtime: $((Get-ItemProperty $found[0]).pv)"
          } else {
            Write-Host 'webview2 runtime: absent — the installer must chain the evergreen bootstrapper'
          }
