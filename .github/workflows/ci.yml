name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: types
        run: bun run check

      - name: tests
        run: bun test src/tests/

      - name: view bundle
        run: bunx vite build

      - name: cli bundle
        run: |
          bun run scripts/build-cli.ts
          node dist/cli/dsmx.mjs --version
          node dist/cli/dsmx.mjs build example/orbit.dsmx -o /dev/null

      - name: Cache native helpers
        uses: actions/cache@v4
        with:
          path: |
            dist/native
            dist/quicklook
          key: native-${{ runner.os }}-${{ hashFiles('bun/native/**', 'src/compiler/builtins.ts', 'src/compiler/lexer.ts', 'package.json') }}

      - name: native helpers
        run: bun run build:native

      - name: Cache Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install WebKit
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install webkit
        timeout-minutes: 5

      - name: smoke
        run: bun run e2e/smoke.ts
        timeout-minutes: 8
