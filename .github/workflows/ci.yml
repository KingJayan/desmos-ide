name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: types
        run: bun run check

      - name: tests
        run: bun test src/tests/

      - name: native helpers
        run: bun run build:native

      - name: view bundle
        run: bun run build:view

      - name: Cache Playwright
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-webkit-${{ runner.os }}-v1
          restore-keys: |
            playwright-webkit-${{ runner.os }}-

      - name: Install WebKit
        run: bunx playwright install webkit

      - name: smoke
        run: bun run e2e/smoke.ts
        timeout-minutes: 8
